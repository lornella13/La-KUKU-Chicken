<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline — La Kuku Chicken</title>
<style>
  html,body{ height:100%; margin:0; }
  body{
    background:#1a1410;
    color:#f6eedd;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  .card{ max-width:360px; }
  .mark{
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 24px;
  }
  .mark img{ display:block; height:84px; width:auto; }
  h1{ font-size:22px; margin:0 0 10px; }
  p{ color:rgba(246,238,221,.7); font-size:14.5px; line-height:1.6; margin:0 0 24px; }
  button{
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; font-weight:700; letter-spacing:.04em;
    background:#f0b429; color:#1a1410; border:none;
    padding:13px 22px; border-radius:3px; cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <img src="/images/brand/logo.png" alt="La Kuku Chicken" width="130" height="90" />
    </div>
    <h1>You're offline</h1>
    <p>La Kuku Chicken needs a connection for this page. Reconnect and try again — pages you've already visited may still work offline.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
